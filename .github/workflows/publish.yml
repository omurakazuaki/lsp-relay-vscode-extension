name: Publish VS Code Extension

on:
  release:
    types: [created]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npx vitest run

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --no-git-tag-version

      - name: Build
        run: npm run build

      - name: Publish to Visual Studio Marketplace
        run: npx @vscode/vsce publish --no-dependencies -p "$VSCE_TOKEN"
        env:
          VSCE_TOKEN: ${{ secrets.VSCE_TOKEN }}

      - name: Upload .vsix to release
        run: |
          npx @vscode/vsce package --no-dependencies -o lsp-relay.vsix
          gh release upload "$GITHUB_REF_NAME" lsp-relay.vsix
        env:
          GH_TOKEN: ${{ github.token }}
